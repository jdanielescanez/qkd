[package]
name = "qkd"
version = "0.0.3"
edition = "2021"
authors = ["Daniel Escanez-Exposito <jescanez@ull.edu.es>"]
description = "A Quantum Key Distribution library developed in Rust"
license = "MIT"
repository = "https://github.com/jdanielescanez/qkd"
documentation = "https://docs.rs/qkd"

[dependencies]
bon = "3.7.2"
num-complex = "0.4.6"
rand = "0.9.2"
rand_chacha = "0.9.0"
statrs = "0.18.0"

[lib]
name = "qkd"
path = "src/lib.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
web-time = "1"
